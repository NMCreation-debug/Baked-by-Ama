<script>

/* ================= ORDER SYSTEM ================= */

const orderForm = document.getElementById('orderForm');

/* LOAD ORDERS */

let orders = JSON.parse(localStorage.getItem('orders')) || [];

/* UPDATE DASHBOARD */

function updateDashboard(){

document.getElementById('totalOrders').innerText =
orders.length;

document.getElementById('pendingOrders').innerText =
orders.length;

/* CALCULATE SALES */

let sales = 0;

orders.forEach(order=>{
sales += Number(order.price);
});

document.getElementById('totalSales').innerText =
"Rs. " + sales.toLocaleString();

}

updateDashboard();

/* SUBMIT ORDER */

orderForm.addEventListener('submit', function(e){

e.preventDefault();

/* GET VALUES */

let name =
document.getElementById('name').value;

let phone =
document.getElementById('phone').value;

let email =
document.getElementById('email').value;

let date =
document.getElementById('date').value;

let cakeSelect =
document.getElementById('cake');

let cakeName =
cakeSelect.options[cakeSelect.selectedIndex].text;

let cakePrice =
cakeSelect.value;

let details =
document.getElementById('details').value;

/* SAVE ORDER */

let order = {

name:name,
phone:phone,
email:email,
date:date,
cake:cakeName,
price:cakePrice,
details:details

};

orders.push(order);

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

/* UPDATE DASHBOARD */

updateDashboard();

/* WHATSAPP MESSAGE */

let message =

`🎂 *NEW ORDER - BAKED BY AMA* 🎂

👤 Name: ${name}

📞 Phone: ${phone}

📧 Email: ${email}

📅 Delivery Date: ${date}

🍰 Cake:
${cakeName}

💰 Price:
Rs. ${cakePrice}

📝 Details:
${details}`;

/* SEND TO WHATSAPP */

let whatsappURL =
`https://wa.me/94766255747?text=${encodeURIComponent(message)}`;

window.open(whatsappURL, '_blank');

/* RESET */

orderForm.reset();

});

/* ================= FIXES ================= */

/* REMOVE DUPLICATE FORM ERROR */

const oldForm = document.querySelector('form[action]');

if(oldForm){

oldForm.removeAttribute('action');

}

/* MOBILE MENU FIX */

const menuBtn =
document.getElementById('menuBtn');

if(menuBtn){

menuBtn.onclick = ()=>{

document.querySelector('.nav-links')
.classList.toggle('active');

};

}

</script>
